<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Syllabus-to-Schedule AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#141414;--tx:#f5f5f5;--mu:#a3a3a3;--ln:#2a2a2a;--ok:#34d399;--bad:#f87171;--b:#fff;--v:#a3a3a3;--cy:#fff}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 50% -5%,#1e1e1e,transparent),var(--bg);color:var(--tx);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{letter-spacing:-.03em;line-height:1.1;font-weight:700}
h1{font-size:2rem}.hero h1{font-size:clamp(2.9rem,13vw,5.6rem);font-weight:800;letter-spacing:-.055em;text-align:center}
h2{font-size:clamp(2rem,7vw,3rem)}h3{font-size:1.15rem}.g{color:#fff}
canvas#p{display:none}
.top{display:flex;align-items:center;gap:.9rem;padding:.9rem 1.2rem;border-bottom:1px solid var(--ln);position:sticky;top:0;background:#0a0a0acc;backdrop-filter:blur(10px);z-index:5;font-size:1.05rem}
.lg{width:42px;height:42px;border-radius:12px;background:#fff;color:#0a0a0a;font-weight:800;display:grid;place-items:center;font-size:1.3rem;flex:none}
.ham{background:none;border:0;font-size:1.7rem;padding:.3rem .6rem;border-radius:10px}
.w{max-width:1000px;margin:0 auto;padding:0 1.2rem}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn{border:1px solid #fff;border-radius:14px;padding:.8rem 1.4rem;font-weight:600;background:#fff;color:#0a0a0a;display:inline-block}
.btn:hover{background:#e5e5e5}.btn.s{background:transparent;color:var(--tx);border-color:var(--ln)}.btn.s:hover{background:#ffffff0f}
.btn.sm{padding:.35rem .75rem;font-size:.85rem;border-radius:10px}.btn:disabled{opacity:.4}
.card{background:var(--card);border:1px solid var(--ln);border-radius:24px;padding:1.4rem;margin-bottom:1rem}
input,select,textarea{background:#0f0f0f;border:1px solid var(--ln);border-radius:12px;padding:.6rem .8rem;width:100%}
label{display:block;font-size:.85rem;color:var(--mu);margin:.6rem 0 .2rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.mu{color:var(--mu)}.row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}.sp{flex:1}
.pill{display:inline-flex;gap:.5rem;border:1px solid #3a3a3a;border-radius:99px;padding:.6rem 1.1rem;color:var(--mu);font-size:.95rem}
.hero{text-align:center;padding:4rem 0 2rem}.hero p{color:var(--mu);font-size:1.2rem;margin:1.6rem auto 2rem;max-width:34rem}.hero .row{flex-direction:column;align-items:center}
.viz{display:flex;align-items:center;gap:1rem;justify-content:center;padding:2rem 1rem}
.doc{width:110px;padding:12px;border-radius:14px;background:#0f0f0f;border:1px solid var(--ln)}
.doc i{display:block;height:7px;border-radius:4px;background:var(--mu);margin:9px 0;opacity:.5;animation:ln 3s infinite}.doc i:nth-child(2n){width:70%}.doc i:nth-child(3n){width:85%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:210px}.cal b{aspect-ratio:1;border-radius:6px;background:#ffffff14;animation:pl 3s infinite}.cal b:nth-child(3n){background:#ffffff55}.cal b:nth-child(5n){background:#fffd}
@keyframes pl{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}@keyframes ln{0%,100%{opacity:.3}50%{opacity:.8}}
section{margin:5rem 0}section>p.mu{font-size:1.2rem;margin:1rem 0 2rem}
.step{padding:2rem 1.8rem;margin-bottom:1.2rem}.step small{color:var(--mu);font-size:1.1rem}.step h3{margin:1.4rem 0 .8rem;font-size:1.5rem}.step p{color:var(--mu);font-size:1.1rem}
.ficon{width:58px;height:58px;border:1px solid var(--ln);border-radius:16px;background:var(--card);display:grid;place-items:center;font-size:1.5rem;margin-bottom:1.4rem}
.feat p{color:var(--mu);font-size:1.15rem;margin:1rem 0}.chk{display:flex;gap:.9rem;align-items:center;border:1px solid var(--ln);border-radius:18px;padding:1rem 1.1rem;margin:.7rem 0;background:#101010}
.ov{position:fixed;inset:0;background:#000b;z-index:20}.dr{position:absolute;left:0;top:0;bottom:0;width:min(82vw,360px);background:#101010;border-right:1px solid var(--ln);padding:1.2rem;overflow:auto}
.dr button.n,.dr a.n{display:flex;gap:1rem;width:100%;text-align:left;background:none;border:0;padding:.9rem .8rem;border-radius:14px;color:var(--mu);font-size:1.15rem;text-decoration:none}.dr .n.on,.dr .n:hover{background:#262626;color:#fff}
main{max-width:1000px;margin:0 auto;padding:1.5rem 1.2rem 6rem}
.fab{position:fixed;right:18px;bottom:20px;z-index:9;width:54px;height:54px;border-radius:50%;font-size:1.3rem;padding:0;box-shadow:0 4px 20px #000a}
.ring{text-align:center}.ring svg{width:92px;height:92px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.task{display:flex;gap:.7rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--ln)}.task.done span{text-decoration:line-through;opacity:.5}.task input[type=checkbox]{width:20px;height:20px;flex:none}.task input[type=date]{width:auto;padding:.25rem}
.tag{font-size:.75rem;padding:.1rem .55rem;border-radius:99px;background:#ffffff14;white-space:nowrap}
.bar{height:8px;border-radius:5px;background:#ffffff14;overflow:hidden}.bar i{display:block;height:100%;background:#fff;transition:width .6s}
.opt{display:block;width:100%;text-align:left;margin:.4rem 0;padding:.8rem;border-radius:14px;border:1px solid var(--ln);background:#101010}.opt.sel{border-color:#fff;background:#ffffff14}.opt.ok{border-color:var(--ok);background:#34d39922}.opt.no{border-color:var(--bad);background:#f8717122}
.msg{padding:.7rem 1rem;border-radius:16px;margin:.5rem 0;max-width:88%;white-space:pre-wrap}.msg.u{background:#262626;margin-left:auto}.msg.a{background:#101010;border:1px solid var(--ln)}
.err{color:var(--bad)}.chip{display:inline-block;margin:3px;padding:.35rem .8rem;border-radius:99px;border:1px solid var(--ln);background:#101010;font-size:.85rem}
.spin{width:18px;height:18px;border:3px solid #ffffff33;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}@keyframes sp{to{transform:rotate(360deg)}}
body.rm *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="p" aria-hidden="true"></canvas><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const LS=(()=>{try{localStorage.setItem('t','1');return localStorage}catch(e){const m={};return{getItem:k=>m[k]??null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ds=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=()=>ds(new Date()),uid=()=>Math.random().toString(36).slice(2,9);
let U=LS.getItem('s2s:user'),S,view='home',T={},bell=false;
const def=()=>({name:U,syl:null,exam:'',plan:null,quizzes:[],chat:[],log:[],rm:false,hash:''});
function load(){S=Object.assign(def(),JSON.parse(LS.getItem('s2s:'+U)||'{}'));document.body.classList.toggle('rm',S.rm)}
const save=()=>LS.setItem('s2s:'+U,JSON.stringify(S));
let menu=false;const go=v=>{view=v;menu=false;render()};
const topics=()=>S.syl?S.syl.subjects.flatMap((s,si)=>s.topics.map((t,ti)=>({...t,subject:s.name,si,ti}))):[];
const tasks=()=>S.plan?S.plan.tasks:[];
async function ai(system,prompt){const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system,prompt})});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||'AI service unavailable. Check ANTHROPIC_API_KEY setup.');return j.text}
const jparse=(t,a)=>{const o=a?'[':'{',c=a?']':'}';return JSON.parse(t.slice(t.indexOf(o),t.lastIndexOf(c)+1))};
function ring(p,l,col='#fff'){const c=226.2;return `<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="36" stroke="#ffffff18"/><circle cx="50" cy="50" r="36" stroke="${col}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}"/></svg><div><b>${Math.round(p)}%</b><div class="mu" style="font-size:.8rem">${l}</div></div></div>`}
const pct=()=>{const t=topics();return t.length?t.filter(x=>x.done).length/t.length*100:0};
/* ---------- landing / auth ---------- */
function landing(){const st=[['01','Upload your syllabus','Drop in a PDF syllabus or course outline. The AI reads it and extracts units, chapters, topics, and any exam dates it finds.'],['02','Review the extraction','Nothing is invented. Every extracted topic is shown for you to rename, correct, or remove before anything is saved.'],['03','Tell us your availability','Set your exam date, daily hours, study days, holidays and the topics you find hard.'],['04','Study with a plan','Get a realistic day-by-day schedule, learn each topic with the AI tutor, take optional quizzes, and track honest progress.']];
const ft=[['🗓','Intelligent scheduling',"A scheduling engine that respects your exam date, available hours, and study days: hard topics come first, revision and a mock test are built in, and the days before your exam are reserved for final revision. If the syllabus can't fit, it tells you honestly.",['Day-by-day plan with durations','Buffer days for unfinished work']],['✦','AI tutor',"Ask questions about your own syllabus, get simple explanations, revision notes and practice questions, and decide what to study next.",['Answers grounded in your topics','Suggested prompts to get started']],['?','Topic quizzes',"Pick a unit, difficulty and length. Get scored results with explanations and a list of topics to revise.",['One question at a time, optional timer','Weak topics tracked over time']]];
return bar()+`<div class="w"><div class="hero"><span class="pill">✦ AI study planning, built for real syllabuses</span><h1 style="margin-top:2rem">Your syllabus.<br>Your strategy.<br>Your success.</h1><p>Turn any syllabus into a personalized study plan. Learn every topic with an AI tutor, test your understanding, and stay on track with an intelligent schedule built around your goals.</p><div class="row"><button class="btn" onclick="signin()">Build My Study Plan</button><a class="btn s" style="text-decoration:none" href="#features">Explore Features</a></div></div>
<div class="card viz" aria-label="A syllabus turning into a study calendar"><div class="doc"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div style="font-size:1.5rem;color:var(--mu)">➜</div><div class="cal">${'<b></b>'.repeat(28).replace(/<b>/g,(m,i)=>`<b style="animation-delay:${(i%9)*.25}s">`)}</div></div>
<section id="how"><h2>How it works</h2><p class="mu">From a raw document to a study schedule you can actually follow, in four steps.</p>${st.map(x=>`<div class="card step"><small>${x[0]}</small><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</section>
<section id="features">${ft.map(f=>`<div class="feat" style="margin-bottom:4rem"><div class="ficon" aria-hidden="true">${f[0]}</div><h2>${f[1]}</h2><p>${f[2]}</p>${f[3].map(c=>`<div class="chk"><span>✓</span><span>${c}</span></div>`).join('')}</div>`).join('')}</section>
<section class="card" style="text-align:center;padding:3rem 1.2rem"><h2>Create your first study plan</h2><p class="mu" style="margin:1rem 0 1.5rem">Your syllabus. Your schedule. Your success.</p><button class="btn" onclick="signin()">Build My Study Plan</button></section></div>`}
function signin(){$('#app').insertAdjacentHTML('beforeend',`<div id="lg" style="position:fixed;inset:0;z-index:20;background:#000a;display:grid;place-items:center"><div class="card" style="width:min(92vw,380px)"><h3>Start your plan</h3><label for="un">Your name or email</label><input id="un" maxlength="60" onkeydown="if(event.key==='Enter')doLogin()"><div class="row" style="margin-top:.8rem"><button class="btn" onclick="doLogin()">Continue</button><button class="btn s" onclick="$('#lg').remove()">Cancel</button></div></div></div>`);$('#un').focus()}
function doLogin(){const n=$('#un').value.trim();if(!n)return;U=n.slice(0,60);LS.setItem('s2s:user',U);load();view='home';render()}
function signout(){LS.removeItem('s2s:user');U=null;render()}
/* ---------- shell ---------- */
function notes(){const n=[],t=today(),k=tasks();const od=k.filter(x=>!x.done&&x.date<t).length;if(od)n.push(['Overdue',`${od} task(s) overdue. Reschedule them in Study Planner.`]);const td=k.filter(x=>!x.done&&x.date===t);if(td.length)n.push(['Today',`${td.length} study session(s) today.`]);if(S.exam){const d=Math.ceil((new Date(S.exam+'T00:00')-new Date(t+'T00:00'))/864e5);if(d>=0&&d<=14)n.push(['Exam',`Exam in ${d} day(s).`])}if(k.some(x=>!x.done&&x.type==='revision'&&x.date===t))n.push(['Revision','A revision session is due today.']);const p=pct();[100,75,50,25].find(m=>p>=m&&n.push(['Milestone',`${m}% of your syllabus is complete.`]));return n}
const bar=()=>`<header class="top"><span class="lg">S</span><b>Syllabus-to-Schedule AI</b><span class="sp"></span><button class="ham" aria-label="Open menu" onclick="menu=true;render()">☰</button></header>`;
function drawer(){const it=U?[['home','Dashboard','▦'],['syllabus','My Study Plans','▤'],['planner','Planner','▥'],['chat','AI Tutor','✦'],['quiz','Topic Quizzes','?'],['progress','Progress','▂▄▆'],['settings','Settings','⚙']]:null;
return `<div class="ov" onclick="if(event.target===this){menu=false;render()}"><nav class="dr" aria-label="Main menu"><div class="row" style="margin-bottom:1.2rem"><b class="sp" style="font-size:1.1rem">Syllabus-to-Schedule AI</b><button class="btn s sm" aria-label="Close menu" onclick="menu=false;render()">✕</button></div>${U?`<button class="btn" style="width:100%;margin-bottom:1rem" onclick="T.draft=null;go('syllabus')">+ New study plan</button>${it.map(([k,l,i])=>`<button class="n ${view===k?'on':''}" onclick="go('${k}')"><span style="width:1.4rem">${i}</span>${l}</button>`).join('')}<button class="n" style="margin-top:1.5rem" onclick="menu=false;signout()"><span style="width:1.4rem">⇥</span>Sign out</button>`:`<a class="n" href="#how" onclick="menu=false;render()">How it works</a><a class="n" href="#features" onclick="menu=false;render()">Features</a><button class="btn" style="width:100%;margin-top:1rem" onclick="menu=false;signin()">Get started</button>`}</nav></div>`}
function render(){if(!U){$('#app').innerHTML=landing()+(menu?drawer():'');return}
$('#app').innerHTML=bar()+`<main id="main">${V[view]()}</main><button class="btn fab" aria-label="Open AI tutor" onclick="go('chat')">✦</button>`+(menu?drawer():'')}
const empty=(m,b,v)=>`<div class="card" style="text-align:center"><p class="mu">${m}</p><br><button class="btn" onclick="go('${v}')">${b}</button></div>`;
/* ---------- views ---------- */
const V={
home(){const t=today(),k=tasks().filter(x=>x.date===t),n=notes(),wk=weekMins(),d=S.exam?Math.ceil((new Date(S.exam+'T00:00')-new Date(t+'T00:00'))/864e5):null;
return `<h1 style="font-size:2rem">Welcome, <span class="g">${esc(U)}</span></h1><p class="mu">Your syllabus. Your schedule. Your success.</p><br>
<div class="grid"><div class="card">${ring(pct(),'Syllabus')}</div><div class="card"><h3>${d===null?'No exam date':d>=0?d+' days':'Exam passed'}</h3><p class="mu">Next exam${S.exam?': '+S.exam:''}</p></div><div class="card"><h3>${k.filter(x=>x.done).length}/${k.length}</h3><p class="mu">Today's tasks done</p></div><div class="card"><h3>${wk.reduce((a,b)=>a+b,0)} min</h3><p class="mu">Studied in last 7 days</p></div></div>
<div class="card"><h3>Quick actions</h3><div class="row" style="margin-top:.6rem"><button class="btn sm" onclick="go('syllabus')">Upload syllabus</button><button class="btn sm" onclick="go('planner')">Generate schedule</button><button class="btn sm" onclick="go('quiz')">Start a quiz</button><button class="btn sm" onclick="go('chat')">Open AI chatbot</button></div></div>
<div class="card"><h3>Today's study tasks</h3>${k.length?k.map(taskRow).join(''):`<p class="mu">${S.plan?'Nothing scheduled today.':'No study plan yet. Upload a syllabus, then generate a schedule.'}</p>`}</div>
<div class="card"><h3>Notifications <span class="mu" style="font-size:.8rem">(in-app only; browser push is not enabled)</span></h3>${n.length?n.map(x=>`<p><span class="tag">${x[0]}</span> ${x[1]}</p>`).join(''):'<p class="mu">You are all caught up.</p>'}</div>
<div class="card"><h3>Upcoming sessions</h3>${tasks().filter(x=>!x.done&&x.date>t).slice(0,5).map(x=>`<p>${x.date} · ${esc(x.title)} <span class="mu">${x.mins} min</span></p>`).join('')||'<p class="mu">None scheduled.</p>'}</div>`},
syllabus(){const cur=T.draft||S.syl;
return `<h2>My Study Plans</h2><div class="card"><label for="f">Upload a text-based PDF syllabus</label><input id="f" type="file" accept="application/pdf" onchange="pickPdf(this)"><label for="pt">Or paste syllabus text (use this for scanned PDFs; OCR is not built in)</label><textarea id="pt" rows="4" placeholder="Paste syllabus text"></textarea><div class="row" style="margin-top:.8rem"><button class="btn" onclick="analyze()">Analyze syllabus</button><span id="st" class="mu"></span></div></div>
${cur?editor(cur):'<div class="card mu">No syllabus yet. Upload a PDF or paste text to begin.</div>'}`},
planner(){if(!S.syl)return `<h2>Planner</h2>`+empty('Add and save a syllabus first.','Go to My Syllabus','syllabus');
const days='Sun Mon Tue Wed Thu Fri Sat'.split(' ');
return `<h2>Planner</h2><div class="card"><div class="grid"><div><label for="ex">Exam or target date</label><input id="ex" type="date" value="${S.exam}"></div><div><label for="hr">Study hours per day</label><input id="hr" type="number" min="0.5" max="12" step=".5" value="${T.hr||2}"></div><div><label for="ss">Session length (min)</label><input id="ss" type="number" min="15" max="180" step="5" value="${T.ss||45}"></div></div>
<label>Preferred study days</label><div class="row">${days.map((d,i)=>`<label style="display:inline;margin:0"><input type="checkbox" class="dy" value="${i}" ${i>0&&i<6||T.dy?.includes(i)?'checked':''} style="width:auto"> ${d}</label>`).join('')}</div>
<label for="hd">Difficult subjects or topics (comma separated)</label><input id="hd" value="${esc(T.hd||'')}"><label for="ho">Holidays / busy dates (YYYY-MM-DD, comma separated)</label><input id="ho" value="${esc(T.ho||'')}" placeholder="2026-11-14, 2026-11-20">
<div class="row" style="margin-top:.8rem"><button class="btn" onclick="makePlan()">${S.plan?'Regenerate plan':'Generate plan'}</button><span id="pe" class="err"></span></div></div>${S.plan?planView():''}`},
chat(){const sug=['Explain this topic simply.','Summarize Unit 1.','What should I study today?','Generate five practice questions.','Help me revise for my exam.'];
return `<h2>AI Tutor</h2><div class="card" id="cb" style="min-height:240px">${S.chat.length?S.chat.map(m=>`<div class="msg ${m.r}">${esc(m.c)}</div>`).join(''):'<p class="mu">Ask about your syllabus or study plan.</p>'}${T.busy?'<span class="spin"></span>':''}</div><div>${sug.map(s=>`<button class="chip" onclick="send(this.textContent)">${s}</button>`).join('')}</div><div class="row" style="margin-top:.6rem"><input id="ci" class="sp" aria-label="Message" placeholder="Ask anything about your syllabus" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">Send</button></div><p id="ce" class="err"></p>`},
quiz(){return quizView()},
progress(){const t=topics(),dn=t.filter(x=>x.done).length,wk=weekMins(),qs=S.quizzes,k=tasks(),cons=wk.filter(x=>x>0).length;
const by={};qs.forEach(q=>{(by[q.unit]=by[q.unit]||[]).push(q.score/q.total*100)});const av=Object.entries(by).map(([u,a])=>[u,a.reduce((x,y)=>x+y,0)/a.length]);const weak=av.filter(x=>x[1]<60),strong=av.filter(x=>x[1]>=80),od=k.filter(x=>!x.done&&x.date<today()).length;
const rec=[];if(!t.length)rec.push('Add a syllabus to start tracking.');if(od)rec.push(`Reschedule ${od} overdue task(s).`);weak.forEach(w=>rec.push(`Revise "${w[0]}" (average ${Math.round(w[1])}%).`));if(t.length&&cons<3&&k.length)rec.push(`You studied on ${cons} of the last 7 days. Aim for more consistent sessions.`);if(!qs.length&&t.length)rec.push('Take a quiz to find weak topics.');
const mx=Math.max(30,...wk);
return `<h2>Progress</h2><div class="grid"><div class="card">${ring(pct(),'Syllabus done')}</div><div class="card"><h3>${dn} / ${t.length}</h3><p class="mu">Topics completed / total</p></div><div class="card"><h3>${S.log.reduce((a,b)=>a+b.mins,0)} min</h3><p class="mu">Total study time logged</p></div><div class="card"><h3>${cons}/7</h3><p class="mu">Study days this week</p></div></div>
<div class="card"><h3>Study minutes, last 7 days</h3><svg viewBox="0 0 280 90" style="width:100%;max-width:520px">${wk.map((m,i)=>`<rect x="${i*40+6}" y="${80-m/mx*70}" width="28" height="${m/mx*70}" rx="5" fill="#fff"/><text x="${i*40+20}" y="90" font-size="8" fill="#8e98c4" text-anchor="middle">${m}</text>`).join('')}</svg></div>

const cur=()=>T.draft||S.syl;

/* ---------- PDF + analysis ---------- */
async function pickPdf(el){const f=el.files[0],st=$('#st');if(!f)return;if(f.type!=='application/pdf'||f.size>15e6){st.innerHTML='<span class="err">Choose a PDF under 15 MB.</span>';return}

try{st.innerHTML='<span class="spin"></span> Reading PDF...';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let tx='';for(let i=1;i<=d.numPages;i++){const p=await(await d.getPage(i)).getTextContent();tx+=p.items.map(x=>x.str).join(' ')+'\n'}
if(tx.replace(/\s/g,'').length<80){st.innerHTML='<span class="err">No readable text found. This looks like a scanned PDF and OCR is not available here. Paste the text below instead.</span>';return}
$('#pt').value=tx.slice(0,50000);T.file=h;st.textContent=`Read ${d.numPages} page(s). Click Analyze.`}catch(e){st.innerHTML='<span class="err">Could not read this PDF: '+esc(e.message)+'</span>'}}
async function analyze(){const tx=$('#pt').value.trim(),st=$('#st');if(tx.length<40){st.innerHTML='<span class="err">Upload a PDF or paste more syllabus text first.</span>';return}
st.innerHTML='<span class="spin"></span> AI is analyzing your syllabus...';
try{const o=jparse(await ai('You extract course syllabi into JSON. Never invent topics, units or dates. Use "Unspecified" for missing info. Output JSON only.',`Return {"subjects":[{"name":"","topics":[{"unit":"","title":""}]}],"dates":["only dates stated in the text, with what they are for"]} from this syllabus:\n\n${tx.slice(0,40000)}`));
if(!o.subjects?.length)throw Error('No subjects found in this text.');o.subjects.forEach(s=>s.topics=(s.topics||[]).map(t=>({id:uid(),unit:t.unit||'Unspecified',title:t.title||'Unspecified',done:false,hard:false})));T.draft=o;S.hash=T.file||S.hash;save();render()}catch(e){st.innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
/* ---------- planner ---------- */
function makePlan(){const pe=$('#pe');try{const ex=$('#ex').value,hr=+$('#hr').value,ss=+$('#ss').value,dy=[...document.querySelectorAll('.dy:checked')].map(x=>+x.value),hd=$('#hd').value,ho=$('#ho').value;
Object.assign(T,{hr,ss,dy,hd,ho});if(!ex||ex<=today())throw Error('Pick a future exam date.');if(!dy.length||!(hr>0)||!(ss>=15))throw Error('Check study days, hours and session length.');
const hol=new Set(ho.split(/[\s,]+/).filter(Boolean)),hard=hd.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean),isH=t=>t.hard||hard.some(h=>t.subject.toLowerCase().includes(h)||t.title.toLowerCase().includes(h));
const TT=topics().filter(t=>!t.done);if(!TT.length)throw Error('All topics are already complete.');
let days=[];for(let d=new Date();ds(d)<ex;d.setDate(d.getDate()+1)){if(ds(d)>=today()&&dy.includes(d.getDay())&&!hol.has(ds(d)))days.push(ds(d))}
if(days.length<3)throw Error('Not enough available study days before the exam.');
const fin=days.pop(),mock=days.pop(),buf=days.filter((_,i)=>(i+1)%7===0),study=days.filter(d=>!buf.includes(d)),lc=Math.max(1,Math.ceil(study.length*.7)),learn=study.slice(0,lc),rev=study.slice(lc),cap=hr*60,K=[];
TT.sort((a,b)=>isH(b)-isH(a));let i=0,u=0;
TT.forEach(t=>{const m=Math.round(ss*(isH(t)?1.5:1));if(u+m>cap&&u>0&&i<learn.length-1){i++;u=0}K.push({id:uid(),date:learn[i],type:'learn',subject:t.subject,title:`Learn: ${t.title} (${t.unit})`,mins:m,done:false,topicId:t.id});u+=m});
const load=K.filter(x=>x.date===learn[learn.length-1]).reduce((a,b)=>a+b.mins,0),subs=[...new Set(TT.map(t=>t.subject))];
rev.forEach((d,j)=>{const s=subs[j%subs.length];K.push({id:uid(),date:d,type:'revision',subject:s,title:`Revise: ${s}`,mins:Math.round(cap*.6),done:false},{id:uid(),date:d,type:'practice',subject:s,title:`Practice questions: ${s}`,mins:Math.round(cap*.4),done:false})});
buf.forEach(d=>K.push({id:uid(),date:d,type:'buffer',subject:'All',title:'Buffer: finish unfinished work',mins:cap,done:false}));
K.push({id:uid(),date:mock,type:'mock',subject:'All',title:'Mock test (all subjects)',mins:cap,done:false});
subs.forEach(s=>K.push({id:uid(),date:fin,type:'revision',subject:s,title:`Final revision: ${s}`,mins:Math.round(cap/subs.length),done:false}));
S.exam=ex;S.plan={tasks:K.sort((a,b)=>a.date.localeCompare(b.date)),warn:load>cap*1.05?'Your syllabus needs more time than you have available. The last learning day is overloaded. Add study days or hours.':'',pv:T.pv||'daily'};save();render()}catch(e){pe.textContent=e.message}}
function planView(){const p=S.plan,pv=T.pv||'daily',k=p.tasks,by={};k.forEach(x=>(by[x.date]=by[x.date]||[]).push(x));
const body=pv==='daily'?Object.entries(by).map(([d,a])=>`<div class="card"><h3>${d}${d===today()?' (today)':''}</h3>${a.map(x=>`<div class="task ${x.done?'done':''}"><input type="checkbox" aria-label="Complete" ${x.done?'checked':''} onchange="tog('${x.id}',this.checked)"><span class="sp"><input style="width:100%" aria-label="Task" value="${esc(x.title)}" onchange="tasks().find(t=>t.id==='${x.id}').title=this.value;save()"></span><span class="tag">${x.mins}m</span><input type="date" aria-label="Reschedule" value="${x.date}" onchange="mv('${x.id}',this.value)"><button class="btn s sm" aria-label="Delete task" onclick="rm('${x.id}')">✕</button></div>`).join('')}</div>`).join('')
:pv==='week'?weeks(by):pv==='subj'?[...new Set(topics().map(t=>t.subject))].map(s=>{const a=topics().filter(t=>t.subject===s),d=a.filter(t=>t.done).length;return `<div class="card"><div class="row"><b class="sp">${esc(s)}</b><span class="mu">${d}/${a.length}</span></div><div class="bar"><i style="width:${d/a.length*100}%"></i></div><p class="mu">Planned time: ${k.filter(x=>x.subject===s).reduce((a,b)=>a+b.mins,0)} min</p></div>`}).join('')
:S.syl.subjects.map(s=>`<div class="card"><h3>${esc(s.name)}</h3>${s.topics.map(t=>`<label style="display:flex;gap:.5rem;color:var(--tx)"><input type="checkbox" style="width:auto" ${t.done?'checked':''} onchange="chk('${t.id}',this.checked)">${esc(t.unit)}: ${esc(t.title)}</label>`).join('')}</div>`).join('');
return `<div class="row" style="margin:1rem 0">${[['daily','Daily'],['week','Weekly'],['subj','By subject'],['list','Checklist']].map(([k,l])=>`<button class="btn ${pv===k?'':'s'} sm" onclick="T.pv='${k}';render()">${l}</button>`).join('')}<button class="btn s sm" onclick="resched()">Move overdue to today</button></div>${p.warn?`<p class="err">${p.warn}</p>`:''}${body}`}
function weeks(by){const ds0=Object.keys(by),out={};ds0.forEach(d=>{const dt=new Date(d+'T00:00');dt.setDate(dt.getDate()-dt.getDay());(out[ds(dt)]=out[ds(dt)]||[]).push(d)});return Object.entries(out).map(([w,a])=>`<div class="card"><h3>Week of ${w}</h3>${a.map(d=>`<p><b>${d.slice(5)}</b> ${by[d].map(x=>`<span class="tag">${esc(x.title.slice(0,32))}</span>`).join(' ')}</p>`).join('')}</div>`).join('')}
const mv=(id,v)=>{if(v){tasks().find(t=>t.id===id).date=v;S.plan.tasks.sort((a,b)=>a.date.localeCompare(b.date));save();render()}};
const rm=id=>{S.plan.tasks=tasks().filter(t=>t.id!==id);save();render()};
const resched=()=>{tasks().forEach(x=>{if(!x.done&&x.date<today())x.date=today()});save();render()};
const chk=(id,v)=>{S.syl.subjects.forEach(s=>s.topics.forEach(t=>{if(t.id===id)t.done=v}));save()};
/* ---------- chat ---------- */
async function send(m){const i=$('#ci');m=(m||i.value).trim();if(!m||T.busy)return;if(!S.syl){$('#ce').textContent='Save a syllabus first so answers can use it.'}
S.chat.push({r:'u',c:m});T.busy=true;render();
const ctx=S.syl?S.syl.subjects.map(s=>`${s.name}: ${s.topics.map(t=>t.unit+' - '+t.title+(t.done?' [done]':'')).join('; ')}`).join('\n'):'No syllabus saved.';const td=tasks().filter(x=>x.date===today()&&!x.done).map(x=>x.title).join('; ')||'none';
try{const r=await ai(`You are a friendly study assistant. Use the student's syllabus when relevant. Never claim questions will appear in exams. Be clear and concise. Today is ${today()}; exam date: ${S.exam||'not set'}.\nSYLLABUS:\n${ctx}\nTODAY'S OPEN TASKS: ${td}`,S.chat.slice(-12).map(x=>(x.r==='u'?'Student: ':'Assistant: ')+x.c).join('\n')+'\nAssistant:');S.chat.push({r:'a',c:r.trim()})}catch(e){S.chat.push({r:'a',c:'Error: '+e.message})}
T.busy=false;S.chat=S.chat.slice(-40);save();render();window.scrollTo(0,document.body.scrollHeight)}
/* ---------- quiz ---------- */
function quizView(){const q=T.q;if(!S.syl)return `<h2>Topic Quizzes</h2>`+empty('Save a syllabus to generate quizzes.','Go to My Syllabus','syllabus');
if(!q){const subs=S.syl.subjects;return `<h2>Topic Quizzes</h2><div class="card"><label for="qs">Subject</label><select id="qs" onchange="T.qsel=this.value;render()">${subs.map((s,i)=>`<option value="${i}" ${+T.qsel===i?'selected':''}>${esc(s.name)}</option>`).join('')}</select><label for="qu">Unit / chapter</label><select id="qu"><option value="">All units</option>${[...new Set(subs[T.qsel||0].topics.map(t=>t.unit))].map(u=>`<option>${esc(u)}</option>`).join('')}</select><div class="grid"><div><label for="qd">Difficulty</label><select id="qd"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></div><div><label for="qn">Questions</label><input id="qn" type="number" min="3" max="20" value="5"></div><div><label for="qt">Timer (minutes, 0 = off)</label><input id="qt" type="number" min="0" max="120" value="0"></div></div><div class="row" style="margin-top:.8rem"><button class="btn" onclick="genQuiz()">Generate quiz</button><span id="qe" class="err"></span></div></div>${S.quizzes.length?`<div class="card"><h3>Past attempts</h3>${S.quizzes.slice(-5).reverse().map(a=>`<p>${a.date} · ${esc(a.unit)} · ${a.diff} <span class="tag">${a.score}/${a.total}</span></p>`).join('')}</div>`:''}`}
if(q.done){const sc=q.qs.filter((x,i)=>q.a[i]===x.answer).length;return `<h2>Results</h2><div class="card">${ring(sc/q.qs.length*100,'Accuracy')}<h3>${sc} / ${q.qs.length} correct</h3></div>${q.qs.map((x,i)=>{const ok=q.a[i]===x.answer;return `<div class="card"><p><b>${i+1}. ${esc(x.q)}</b> ${ok?'✅':'❌'}</p>${x.options.map((o,j)=>`<div class="opt ${j===x.answer?'ok':j===q.a[i]?'no':''}">${esc(o)}</div>`).join('')}<p class="mu">${esc(x.explanation)}</p></div>`}).join('')}<div class="card"><h3>Revise next</h3>${sc===q.qs.length?'<p>Great result. Try a harder level.</p>':`<p>Revisit: ${esc(q.unit)}. Review the ${q.qs.length-sc} question(s) marked above.</p>`}</div><button class="btn" onclick="T.q=null;render()">New quiz</button>`}
const x=q.qs[q.i];return `<div class="row"><h2 class="sp">Question ${q.i+1} of ${q.qs.length}</h2><b id="tm">${q.end?'':''}</b></div><div class="bar"><i style="width:${(q.i+1)/q.qs.length*100}%"></i></div><div class="card" style="margin-top:1rem"><h3>${esc(x.q)}</h3>${x.options.map((o,j)=>`<button class="opt ${q.a[q.i]===j?'sel':''}" onclick="T.q.a[T.q.i]=${j};render()">${esc(o)}</button>`).join('')}</div><div class="row"><button class="btn s" ${q.i?'':'disabled'} onclick="T.q.i--;render()">Previous</button>${q.i<q.qs.length-1?`<button class="btn" onclick="T.q.i++;render()">Next</button>`:''}<button class="btn" onclick="finish()">Submit quiz</button></div>`}
async function genQuiz(){const si=+($('#qs').value||0),u=$('#qu').value,d=$('#qd').value,n=Math.min(20,Math.max(3,+$('#qn').value||5)),tm=+$('#qt').value||0,s=S.syl.subjects[si],tp=s.topics.filter(t=>!u||t.unit===u).map(t=>t.title).join('; ');
$('#qe').innerHTML='<span class="spin"></span> Generating...';
try{const qs=jparse(await ai('You write study quizzes strictly from the given syllabus topics. Never claim questions are from or will appear in real exams. Output JSON only.',`Write ${n} ${d} multiple-choice questions for "${s.name}", unit "${u||'all'}", based only on these topics: ${tp}. Return [{"q":"","options":["","","",""],"answer":0,"explanation":""}] where answer is the 0-based index of the correct option.`),1).filter(x=>x.q&&x.options?.length===4&&x.answer>=0&&x.answer<4);
if(!qs.length)throw Error('No valid questions returned. Try again.');T.q={qs,i:0,a:[],unit:u||s.name,diff:d,done:false};if(tm){T.q.end=Date.now()+tm*6e4;clearInterval(T.iv);T.iv=setInterval(tick,1000)}render()}catch(e){$('#qe').textContent=e.message}}
function tick(){const q=T.q;if(!q||q.done){clearInterval(T.iv);return}const r=Math.max(0,Math.round((q.end-Date.now())/1e3)),e=$('#tm');if(e)e.textContent=`${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}`;if(!r)finish()}
function finish(){const q=T.q;clearInterval(T.iv);q.done=true;S.quizzes.push({date:today(),unit:q.unit,diff:q.diff,score:q.qs.filter((x,i)=>q.a[i]===x.answer).length,total:q.qs.length});save();render()}
/* ---------- particles (lightweight) ---------- */
(function(){const c=$('#p'),x=c.getContext('2d');let P=[];function rs(){c.width=innerWidth;c.height=innerHeight}rs();addEventListener('resize',rs);const n=innerWidth<800?25:50;for(let i=0;i<n;i++)P.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.8+.4,v:Math.random()*.25+.05});
(function f(){x.clearRect(0,0,c.width,c.height);if(!(S&&S.rm)&&!matchMedia('(prefers-reduced-motion:reduce)').matches){x.fillStyle='#fff66';P.forEach(p=>{p.y-=p.v;if(p.y<0)p.y=c.height;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()})}requestAnimationFrame(f)})()})();
